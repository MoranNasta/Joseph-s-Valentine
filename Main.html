<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffd6e7;
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      width: 350px;
      height: 250px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 80px;
    }

    button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      background: #ff4d88;
      color: white;
      left: 60px;
    }

    #no {
      background: #ddd;
      right: 60px;
    }

    .gif-container {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .gif-container img {
      width: 300px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Will you be my Valentine?</h1>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="gif-container" id="gif">
    <h1>I love you ❤️</h1>
    <img src="https://media.tenor.com/images/44c22c6c1c3b9e2d5c3cbd0d57b9ed9a/tenor.gif" alt="Bear Hug">
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");
    const gif = document.getElementById("gif");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 100 - 50;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
      card.style.display = "none";
      gif.style.display = "flex";
    });
  </script>

</body>
</html>
