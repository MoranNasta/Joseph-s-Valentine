<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffd6e7;
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      width: 360px;
      height: 260px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 12px 35px rgba(0,0,0,0.18);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 90px;
    }

    button {
      padding: 12px 26px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.15s ease;
    }

    #yes {
      background: #ff4d88;
      color: white;
      left: 70px;
    }

    #no {
      background: #e0e0e0;
      right: 70px;
    }

    .gif-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .gif-container img {
      width: 300px;
      border-radius: 14px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- Valentine Card -->
  <div class="card" id="card">
    <h1>Marie Jose,<br>will you be my Valentine?</h1>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <!-- GIF Screen -->
  <div class="gif-container" id="gif">
    <h1>I love you ❤️</h1>
    <img
      src="https://media.tenor.com/images/44c22c6c1c3b9e2d5c3cbd0d57b9ed9a/tenor.gif"
      alt="Bear Hug"
    />
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");
    const gif = document.getElementById("gif");

    function moveNo() {
      const x = Math.random() * 220 - 110;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    yesBtn.addEventListener("click", () => {
      card.style.display = "none";
      gif.style.display = "flex";
    });
  </script>

</body>
</html>
